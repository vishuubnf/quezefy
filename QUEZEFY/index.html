<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUEZEFY</title>
    <style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: red url('a.jpeg') no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
}

        .title {
            font-size: 6rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
            animation: slideLoop 3s infinite ease-in-out;
        }

        @keyframes slideLoop {
            0% { transform: translateX(-20px); opacity: 0.5; }
            50% { transform: translateX(20px); opacity: 1; }
            100% { transform: translateX(-20px); opacity: 0.5; }
        }

        .container {
            text-align: center;
            width: 80%;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: center;
        }

        .card {
            padding: 15px;
            font-size: 1.1rem;
            width: 180px;
            height: 140px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Assign different background colors */
        .card:nth-child(1) { background: #ff5733; }
        .card:nth-child(2) { background: #3498db; }
        .card:nth-child(3) { background: #2ecc71; }
        .card:nth-child(4) { background: #f39c12; }
        .card:nth-child(5) { background: #9b59b6; }
        .card:nth-child(6) { background: #e74c3c; }
        .card:nth-child(7) { background: #1abc9c; }
        .card:nth-child(8) { background: #d35400; }
        .card:nth-child(9) { background: #34495e; }

        .card:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .card.selected {
            border: 4px solid white;
        }

        .card img {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
        }

        .instruction {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .play-button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            background: #ff5733;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .play-button:hover {
            background: #e74c3c;
            transform: scale(1.1);
        }

        #mute-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            border: none;
            font-size: 24px;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        #mute-button:hover {
            background: lightgray;
        }
    </style>
</head>

<body>
    <h1 class="title">QUEZEFY</h1>
    <div class="container">
        <div class="content">
            <div class="categories" id="categories">
                <div class="card" onclick="selectCategory(this)">
                    <img src="art.svg" alt="Category 1">
                    <span>ART</span>
                </div>
                <div class="card" onclick="selectCategory(this)">
                    <img src="entertainment.svg" alt="Category 2">
                    <span>ENTERTAINMENT</span>
                </div>
                <div class="card" onclick="selectCategory(this)">
                    <img src="general culture.svg" alt="Category 3">
                    <span>GENERAL CULTURE</span>
                </div>
                <div class="card" onclick="selectCategory(this)">
                    <img src="geography.svg" alt="Category 4">
                    <span>GEOGRAPHY</span>
                </div>
                <div class="card" onclick="selectCategory(this)">
                    <img src="history.svg" alt="Category 5">
                    <span>HISTORY</span>
                </div>
                <div class="card" onclick="selectCategory(this)">
                    <img src="science.svg" alt="Category 6">
                    <span>SCIENCE</span>
                </div>
                <div class="card" onclick="selectCategory(this)">
                    <img src="space.svg" alt="Category 7">
                    <span>SPACE</span>
                </div>
                <div class="card" onclick="selectCategory(this)">
                    <img src="technology.svg" alt="Category 8">
                    <span>TECHNOLOGY</span>
                </div>
                <div class="card" onclick="selectCategory(this)">
                    <img src="mix.svg" alt="All Mix">
                    <span>MIX</span>
                </div>
            </div>
            <p class="instruction">Please choose a category to play the quiz:</p>
            <button class="play-button" onclick="startQuiz()">Play</button>
        </div>
    </div>

    <audio id="background-audio" loop autoplay>
        <source src="homemusic.mp3" type="audio/mp3">
    </audio>

    <button id="mute-button">🔊</button>

    <script>
        let selectedCategory = null;
        const audio = document.getElementById("background-audio");
        const muteButton = document.getElementById("mute-button");

        // function selectCategory(element) {
        //     document.querySelectorAll(".card").forEach(card => card.classList.remove("selected"));
        //     element.classList.add("selected");
        //     selectedCategory = element.textContent;
        // }
        function selectCategory(element) {
    document.querySelectorAll(".card").forEach(card => card.classList.remove("selected"));
    element.classList.add("selected");
    selectedCategory = element.querySelector("span").textContent.trim(); // Trim whitespace
}

        function startQuiz() {
    if (!selectedCategory) {
        alert("Please select a category before starting the quiz!");
        return;
    }
    //sessionStorage.setItem("selectedCategory", "space")
    sessionStorage.setItem("selectedCategory", selectedCategory);
    window.location.href = "quiz.html"; // Redirect to quiz page
}


        window.onload = () => {
            audio.play().catch(() => {
                document.addEventListener("click", playAudio);
            });
        };

        function playAudio() {
            audio.play();
            document.removeEventListener("click", playAudio);
        }

        muteButton.addEventListener("click", () => {
            audio.muted = !audio.muted;
            muteButton.textContent = audio.muted ? "🔇" : "🔊";
        });
    </script>
</body>

</html>
